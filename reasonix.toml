ip(a, b)) / (math.sqrt(sum(x*x for x in a)) * math.sqrt(sum(x*x for x in b)) or 1)\n\n# 语料库：5 道题（3 道恒成立求参数 + 2 道干扰项）\ncorpus = [\n    (\"题A 恒成立·不等式\", \"已知对任意 x>0，不等式 ax²+x+1≥0 恒成立，求 a 的取值范围\", \"恒成立求参数\"),\n    (\"题B 恒成立·函数\", \"若 f(x)=x²+ax+1 在区间 [0,2] 上恒有 f(x)>0，求 a 的范围\", \"恒成立求参数\"),\n    (\"题C 最值·不等式\", \"已知 x>0，求函数 y=x+1/x 的最小值\", \"最值问题\"),\n    (\"题D 恒成立·对数\", \"若 log₂(x²+ax+1)>0 对一切实数 x 恒成立，求 a 的取值范围\", \"恒成立求参数\"),\n    (\"题E 递推·数列\", \"数列 {aₙ} 满足 a₁=1，aₙ₊₁=2aₙ+1，求通项公式\", \"递推求通项\"),\n]\nquery = (\"若 sin²x + a·sinx + 1 ≥ 0 对任意实数 x 恒成立，求 a 的取值范围\", \"恒成立求参数\")\n\n# 模式 A：纯题干\nqa = embed([q[0] for q in corpus] + [query[0]])\n# 模式 B：题干+题型\nqb = embed([f\"{q[0]}。题型：{q[1]}\" for q in corpus] + [f\"{query[0]}。题型：{query[1]}\"])\n\nprint(f\"{'':10s} {'纯题干检索':>14s} {'题干+题型检索':>16s}  期望\")\nprint(\"-\"*58)\nfor i, (name, _, _) in enumerate(corpus):\n    sa = cos(qa[-1], qa[i])\n    sb = cos(qb[-1], qb[i])\n    expect = \"✓同类\" if \"恒成立\" in name else \"✗干扰\"\n    print(f\"{name:10s} {sa:>12.4f} {sb:>14.4f}  {expect}\")\n\n# 排序对比\nra = sorted(range(5), key=lambda i: -cos(qa[-1], qa[i]))\nrb = sorted(range(5), key=lambda i: -cos(qb[-1], qb[i]))\nprint(\"\\n纯题干 top-3:\", [corpus[i][0].split(' ')[1] for i in ra[:3]])\nprint(\"题干+题型 top-3:\", [corpus[i][0].split(' ')[1] for i in rb[:3]])\nprint(\"正确召回（恒成立3题在前3）: 纯题干:\", set(ra[:3]) == {0,1,3}, \"| 题干+题型:\", set(rb[:3]) == {0,1,3})\nEOF", "Bash=cd /Users/apple/Desktop/ai-learning-system && python3 << 'EOF'\nimport json, urllib.request, os, math, re\n\nkey = None\nfor line in open('.env'):\n    m = re.match(r'QWEN_API_KEY=(.+)', line.strip())\n    if m: key = m.group(1).strip()\n\ndef embed(texts):\n    body = {\"model\": \"text-embedding-v4\", \"input\": texts}\n    req = urllib.request.Request(\n        \"https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings\",\n        data=json.dumps(body).encode(),\n        headers={\"Content-Type\": \"application/json\", \"Authorization\": f\"Bearer {key}\"})\n    resp = json.loads(urllib.request.urlopen(req, timeout=30).read())\n    return [d['embedding'] for d in resp['data']]\n\ndef cos(a, b):\n    return sum(x*y for x, y in zip(a, b)) / (math.sqrt(sum(x*x for x in a)) * math.sqrt(sum(x*x for x in b)) or 1)\n\n# 更难组：表面无「恒成立」字样 / 干扰项故意带「恒成立」\ncorpus = [\n    (\"题A 恒成立·不等式\", \"对任意 x>0，ax²+x+1≥0 总成立，求 a 的范围\", \"恒成立求参数\"),\n    (\"题B 恒成立·三角\", \"设对一切实数 x，sin²x+a·sinx+1 都不小于 0，求 a\", \"恒成立求参数\"),\n    (\"题C 最值·函数\", \"求 f(x)=x²-4x+3 在 [0,3] 上的最小值\", \"最值问题\"),\n    (\"题D 恒成立·对数\", \"已知对任意实数 x，log₂(x²+ax+1) 均有意义，求 a\", \"恒成立求参数\"),\n    (\"题E 恒成立·误导项\", \"证明：对任意 x>0，e^x > x+1 恒成立\", \"不等式证明\"),\n]\nquery = (\"实数 a 取何值时，二次不等式 x²+ax+2 ≥ 0 对任意实数 x 都成立\", \"恒成立求参数\")\n\nqa = embed([q[0] for q in corpus] + [query[0]])\nqb = embed([f\"{q[0]}。题型：{q[1]}\" for q in corpus] + [f\"{query[0]}。题型：{query[1]}\"])\n\nprint(f\"{'':16s} {'纯题干':>10s} {'题干+题型':>12s}\")\nprint(\"-\"*42)\nfor i, (name, _, _) in enumerate(corpus):\n    sa = cos(qa[-1], qa[i]); sb = cos(qb[-1], qb[i])\n    tag = \"✓同类\" if \"恒成立\" in name and \"证明\" not in name else \"✗干扰\"\n    print(f\"{name:16s} {sa:>10.4f} {sb:>12.4f}  {tag}\")\n\nra = sorted(range(5), key=lambda i: -cos(qa[-1], qa[i]))\nrb = sorted(range(5), key=lambda i: -cos(qb[-1], qb[i]))\nprint(\"\\n纯题干 top-3:\", [corpus[i][0].split(' ')[1] for i in ra[:3]])\nprint(\"题干+题型 top-3:\", [corpus[i][0].split(' ')[1] for i in rb[:3]])\nok_a = set(ra[:3]) == {0,1,3}\nok_b = set(rb[:3]) == {0,1,3}\nprint(f\"\\n正确召回: 纯题干={'✅' if ok_a else '❌'}  题干+题型={'✅' if ok_b else '❌'}\")\nEOF", "Bash=cd /Users/apple/Desktop/ai-learning-system && python3 << 'EOF'\n# ROADMAP 加一行\np = 'ROADMAP.md'\ns = open(p).read()\nline = '| 2026-08-15 | **报告设计进入探讨（P0）**：定位=处方；范围=①结论+③行动+④趋势占位+RAG；生成=规则+AI整理；入口可选查看；报告按知识点组织、题型（解题模式）为语义锚；RAG=模糊匹配实测成立（题型锚拉大同类/干扰间距）；讨论状态见 `doc/报告设计-讨论状态.md`（Q1~Q18 待商讨） |\\n| 2026-08-14 | **决策 025：掌握度链路重建**'\ns = s.replace('| 2026-08-14 | **决策 025：掌握度链路重建**', line, 1)\nopen(p, 'w').write(s)\nprint('ROADMAP 已更新')\nEOF\ngit add -