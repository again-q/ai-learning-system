: { type: 'json_object' }, messages:\"\nassert old in src\nsrc = src.replace(old, new)\n\n# 2) TASK 改为 JSON 结构化输出\nold_marker = \"const TASK = `\"\nidx = src.index(old_marker)\nend_idx = src.index(\"`;\", idx)\nnew_task = \"\"\"const TASK = `请用【学生视角】评估第 (3)(ii) 小问的难度，模拟一个数学中等偏上、能做出 (1)(2)、第一次接触新定义集合 D(x0) 题的高中生。不要严谨证明、不要拆解题步骤，只做学生认知体验的深度评估。\n\n请深度思考后，只输出一个 JSON 对象（不要输出任何其他内容），结构如下：\n{\n  \"cognitive_path\": \"学生看到题后的认知路径：先注意什么、先尝试什么、第一次卡在哪、卡住时缺的是什么（知识没学过/想到了不会组合/不知道从哪下手）\",\n  \"knowledge_bases\": [\"逐个列出需要但学生可能不具备的知识储备，标出是基础还是本题特有\"],\n  \"jumps\": [{\"jump\": \"思维跳跃内容（从A想到B）\", \"difficulty\": \"自然|需要提示|极难想到\"}],\n  \"unfamiliarity\": \"陌生度描述：新定义集合题对中档生常见吗\",\n  \"trial_cost\": \"试错成本：走错方向能否回来\",\n  \"score\": \"难度分数 0~10（数字越大越难）\",\n  \"bases\": [\"每条依据，对应上面的认知负荷项\"]\n}`\"\"\"\nsrc = src[:idx] + new_task + src[end_idx:]\n\n# 3) 输出解析：JSON\nold_parse = \"\"\"  const msg = r.choices[0].message;\n  const raw = msg.content || msg.reasoning_content || '';\n  console.log('② 拆解+难度评估 ✅', Math.round((Date.now() - t1) / 1000) + 's, content:', msg.content ? '有' : '空(回退reasoning)');\n  console.log('\\\\n' + raw.slice(0, 4000));\"\"\"\nnew_parse = \"\"\"  const msg = r.choices[0].message;\n  const raw = msg.content || msg.reasoning_content || '';\n  console.log('② 学生视角难度评估 ✅', Math.round((Date.now() - t1) / 1000) + 's, content:', msg.content ? '有' : '空(回退reasoning)');\n  try {\n    const parsed = JSON.parse(raw.replace(/```json|```/g, ''));\n    console.log('\\\\n分数:', parsed.score + '/10');\n    console.log('\\\\n【认知路径】\\\\n' + parsed.cognitive_path);\n    console.log('\\\\n【知识储备】\\\\n- ' + (parsed.knowledge_bases || []).join('\\\\n- '));\n    console.log('\\\\n【思维跳跃】');\n    (parsed.jumps || []).forEach(j => console.log('- ' + j.jump + ' —— ' + j.difficulty));\n    console.log('\\\\n【陌生度】' + parsed.unfamiliarity);\n    console.log('\\\\n【试错成本】' + parsed.trial_cost);\n    console.log('\\\\n【评分依据】');\n    (parsed.bases || []).forEach(b => console.log('- ' + b));\n  } catch (e)