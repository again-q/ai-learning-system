th.abs(b-P)<Math.abs(a-P)?b:a);\n  return { D, eta, P };\n}\n// 修复前（读 difficultyLevel 等——P0 现场）\nfunction oldClamp(raw, questionType) {\n  const [lo,hi] = LR[raw.difficultyLevel] || [0.01,0.999];\n  const D = Math.min(hi, Math.max(lo, Number(raw.difficultyValue) || lo));\n  const eta = questionType === \"解答\" ? raw.pathQuality : null;\n  let P = Number(raw.processScore);\n  if (!P_BINS.includes(P)) P = P_BINS.reduce((a,b)=>Math.abs(b-P)<Math.abs(a-P)?b:a);\n  return { D, eta, P };\n}\n\nconst img = fs.readFileSync(\"/Users/apple/Desktop/微信图片_20260806215638_61_127.jpg\").toString(\"base64\");\nconst VISION_PROMPT = `你是数学学习诊断助手的图像理解阶段。任务：准确转录题目 + 如实描述做题痕迹。不要做诊断判断。输出 Markdown：# 题目转录（每题：题号/完整题干含所有条件和选项内容/题目形式）# 做题痕迹观察（按书写顺序逐条；涂改/草稿/最终答案）# 最终答案逐字符精确（≥≤><=符号不能错）；不臆测`;\nconst RUBRIC = `【D 难度：L1~L11 档位钳制+档内自由。第1步判 Lx 档（例子锚：L1求A∩B/L2求√定义域/L3比log/L4△ABC求c/L5裂项/L6含参零点/L7极点极线/L8极值点偏移/L9多高观点/L10竞赛/L11IMO）；第2步档内自由打 D 值。题型：回忆类/单元内/跨单元。P（§4.4）：1.0清晰/0.5模糊/0.3思路对/0空白。η：只对解答题0.4~1.0；填空选择null。r：一律null。isCorrect严格数学判定。归因做错才给。`;\n\n(async () => {\n  // 1. Qwen 转录\n  const v = await fetch(\"https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions\", {\n    method:\"POST\",\n    headers:{\"Content-Type\":\"application/json\",Authorization:\"Bearer \"+QKEY},\n    body:JSON.stringify({model:\"qwen3.7-plus\",messages:[{role:\"user\",content:[{type:\"image_url\",image_url:{url:\"data:image/jpeg;base64,\"+img}},{type:\"text\",text:VISION_PROMPT}]}],max_tokens:2500,enable_thinking:false})\n  }).then(r=>r.json());\n  const report = v.choices[0].message.content;\n  console.log(\"① Qwen 转录 ✅（长度\", report.length, \"）\");\n\n  // 2. DeepSeek 判定\n  const userMsg = `按 rubric 对每题输出：{\"questions\":[{\"index\":1,\"questionText\":\"\",\"questionType\":\"选择|填空|解答|其他\",\"questionCategory\":\"\",\"level\":\"L1~L11\",\"D\":0~1,\"isCorrect\":true|false,\"correctAnswer\":\"\",\"P\":0|0.3|0.5|1.0,\"eta\":0.4~1.0|null,\"r\":null,\"errorAttribution\":null|\"\"}]} 只输出 JSON`;\n  const d = await fetch(\"https://api.deepseek.com/chat/completions\", {\n    method:\"POST\",\n    headers:{\"Content-Type\":\"application/json\",Authorization:\"Bearer \"+process.env.DEEPSEEK_API_KEY},\n    body:JSON.stringify({model:\"deepseek-chat\",temperature:0.2,messages:[{role:\"system\",content:\"严格按 rubric，只输出 JSON。\"},{role:\"user\",content:userMsg+\"\\n===== rubric =====\\n\"+RUBRIC+\"\\n===== vision =====\\n\"+report}],max_tokens:3000})\n  }).then(r=>r.json());\n  const raw = d.choices[0].message.content;\n  const parsed = JSON.parse(raw.slice(raw.indexOf(\"{\"), raw.lastIndexOf(\"}\")+1));\n  console.log(\"② DeepSeek 判定 ✅，题数:\", parsed.questions.length);\n\n  // 3. 逐题对比 修复前 vs 修复后\n  for (const q of parsed.questions) {\n    const type = q.questionType || \"其他\";\n    const oldR = oldClamp(q, type);\n    const newR = clampParams(q, type);\n    console.log(`题${q.index} [${type}] 模型输出: level=${q.level} D=${q.D} P=${q.P} eta=${q.eta}`);\n    console.log(`   ❌ 修复前(旧字段): D=${oldR.D} P=${oldR.P} eta=${oldR.eta}  ← P0 现场`);\n    console.log(`   ✅ 修复后(新字段): D=${newR.D.toFixed(3)} P=${newR.P} eta=${newR.eta}`);\n  }\n})();\n' 2>&1", "Bash=cd /Users/apple/Desktop/ai-learning-system && DEEPSEEK_API_KEY=sk-REMOVED node -e '\nconst fs = require(\"fs\");\nconst env = {};\nfs.readFileSync(\".env\",\"utf8\").split(\"\\n\").forEach(l=>{const m=l.match(/^\\s*([A-Za-z_][A-Za-z0-9_]*)\\s*=\\s*(.*)\\s*$/);if(m)env[m[1]]=m[2]});\nconst QKEY = env.QWEN_API_KEY;\nconst img = fs.readFileSync(\"/Users/apple/Desktop/微信图片_20260806215638_61_127.jpg\").toString(\"base64\");\nconst VISION_PROMPT = `你是数学学习诊断助手的图像理解阶段。任务：准确转录题目 + 如实描述做题痕迹。不要做诊断判断。输出 Markdown：# 题目转录（每题：题号/完整题干含所有条件和选项内容/题目形式）# 做题痕迹观察（按书写顺序逐条；涂改/草稿/最终答案）# 最终答案逐字符精确（≥≤><=符号不能错）；不臆测`;\n\n// ===== 用户定的完整版标尺（D难度标尺-L11分层.md 原文，未简化）=====\nconst FULL_SCALE = `\n【D 难度判定标准（完整版 L1~L11 标尺）】\n\n■ 判定流程：第1步用「边界判定速查卡」判 Lx 档（分类）；第2步在档内自由打 D 值；代码钳制回区间。\n\n■ 边界判定速查卡：\n| 判定依据 | 归入层级 | D 值区间 |\n| 读题即写答案，0步推导 | L1 | 0.01–0.15 |\n| 套1个公式，1-2步计算 | L2 | 0.15–0.30 |\n| 套1-2个公式，2-3步推导，无变形 | L3 | 0.30–0.45 |\n| 3-5步标准流程，单一板块内串联 | L4 | 0.45–0.60 |\n| 5-10步流程，轻度分类讨论（2-3类） | L5 | 0.60–0.70 |\n| 10步以上，复杂分类讨论（3-5类），或需二级结论 | L6 | 0.70–0.79 |\n| 需二级结论或高观点工具，或非线性构造 | L7 | 0.79–0.85 |\n| 需高等数学背景初等化理解（泰勒/拉格朗日/帕德） | L8 | 0.85–0.90 |\n| 需多个高观点叠加，或复杂构造性证明 | L9 | 0.90–0.94 |\n| 需课外科板块知识（数论/组合/平几四大定理） | L10 | 0.94–0.98 |\n| 解法纯原创，无模板可套，全球个位数能解 | L11 | 0.98–0.999 |\n\n■ 例子锚（判档参照）：\nL1: A={1,2,3},B={2,3,4} 求 A∩B（读题即写答案）\nL2: f(x)=√(x-1) 求定义域（套1公式1-2步）\nL3: 比较 log₂3 与 log₃4 大小（套1-2公式2-3步无变形）\nL4: △ABC a=5,b=7,C=60° 求 c（3-5步标准流程，课本套路）\nL5: 裂项求和 Σ1/(a_k·a_{k+1})（5-10步，轻度分类讨论）\nL6: e^x−ax² 两零点求 a 范围（复杂含参讨论3-5类）\nL7: 过椭圆外点作切线，切点连线过定点（二级结论/高观点）\nL8: 极值点偏移证明 x₁+x₂>2（高数背景初等化）\nL9: 多高观点叠加（强基/高联一试）\nL10: 竞赛板块（数论/组合/平几四大定理）\nL11: IMO P3/P6（纯原创）\n\n■ 每层 5 维分值锁定表：\n| 层级 | 知识复杂度 | 思维深度 | 陷阱密度 | 计算强度 | 陌生度 |\n| L1 | 1 | 1 | 1 | 1 | 1 |\n| L2 | 1–2 | 1 | 1 | 2 | 1 |\n| L3 | 2 | 1 | 1 | 2 | 2 |\n| L4 | 2 | 2 | 1 | 3 | 2 |\n| L5 | 2 | 2 | 2 | 3 | 2 |\n| L6 | 3 | 3 | 2 | 3 | 2 |\n| L7 | 3 | 3 | 3 | 4 | 3 |\n| L8 | 4 | 4 | 3 | 4 | 3 |\n| L9 | 4 | 4 | 4 | 4 | 4 |\n| L10 | 5 | 5 | 4 | 5 | 5 |\n| L11 | 5 | 5 | 5 | 5 | 5 |\n\n■ 其他判定：题型分类（回忆类=直接套公式/单元内=本单元变形推理分类讨论/跨单元=结合≥2单元）；P（1.0清晰/0.5模糊/0.3思路对/0空白）；η（只对解答题0.4~1.0，填空选择null）；r 一律null；isCorrect严格数学判定；归因做错才给。\n`;\n\nconst userMsg = `输入是视觉转录。严格按上面完整版标尺，对每题输出：\n{\"questions\":[{\"index\":1,\"questionText\":\"\",\"questionType\":\"选择|填空|解答|其他\",\"questionCategory\":\"\",\"level\":\"L1~L11\",\"D\":0~1,\"isCorrect\":true|false,\"correctAnswer\":\"\",\"P\":0|0.3|0.5|1.0,\"eta\":0.4~1.0|null,\"r\":null,\"errorAttribution\":null|\"\"}]}\n约束：D 必须落在 level 的 D 值区间内；只输出 JSON`;\n\n(async () => {\n  const v = await fetch(\"https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions\", {\n    method:\"POST\",headers:{\"Content-Type\":\"application/json\",Authorization:\"Bearer \"+QKEY},\n    body:JSON.stringify({model:\"qwen3.7-plus\",messages:[{role:\"user\",content:[{type:\"image_url\",image_url:{url:\"data:image/jpeg;base64,\"+img}},