,3 / L8=4,4,3,4,3 / L9=4,4,4,4,4 / L10=5,5,4,5,5 / L11=全5\n\n■ 题型分类（门禁1）：回忆类=默写/复述/直接套公式无推理；单元内应用=本单元变形推理分类讨论；跨单元应用=结合≥2单元知识；无法归类\n  ⚠️ 判断标准：题目是否需要变形/推理/分类讨论？需要且不跨单元=单元内；只需套公式=回忆；跨了集合+方程+韦达=跨单元\n\n■ P 过程分（理论§4.4）：1.0 完全正确思路清晰 / 0.5 部分正确模糊 / 0.3 错误但有思路 / 0 完全错误空白\n\n■ η 路径质量：**只对解答题（有步骤文本）判**——0.4~1.0，本质解法(分类完整逻辑严谨)=0.9+；暴力/漏情况=0.4-0.6。\n  ⚠️ 填空/选择题（无过程证据）→ 你必须输出 null，禁止给任何数值！\n\n■ r：一律 null（无追问）\n\n■ isCorrect：按数学严格判定。题4 结论 a<−4 或 a≥4 或 a=−2：a≥4 已覆盖 a=4（a=4 时 B={−2}⊆A 成立），逐项核验后判定。\n\n■ 归因：做错才给；做对 null。不编造。\n`;\n\nconst sys = \"你是严谨的数学诊断推理引擎（DeepSeek Flash 角色）。严格按 rubric：你只输出分类结果，不输出 D 数值、不输出 η 数值（除非解答题）。只输出 JSON。\";\nconst userMsg = `输入为可信 process_evidence。按 rubric 对每题输出：\n{\"questions\":[{\"index\":1,\"questionCategory\":\"回忆类|单元内应用|跨单元应用\",\"level\":\"L1~L11\",\"dim\":{\"知识复杂度\":1-5,\"思维深度\":1-5,\"陷阱密度\":1-5,\"计算强度\":1-5,\"陌生度\":1-5},\"isCorrect\":true|false,\"correctAnswer\":\"\",\"P\":0|0.3|0.5|1.0,\"eta\":0.4~1.0|null,\"r\":null,\"errorAttribution\":null|\"\",\"knowledgePoints\":[\"\"]}]}\n约束：禁止输出 D 数值；eta 只在解答题给数值、填空选择必须 null；只输出 JSON`;\n\nasync function run(n) {\n  const r = await fetch(\"https://api.deepseek.com/chat/completions\", {\n    method: \"POST\",\n    headers: { \"Content-Type\": \"application/json\", Authorization: \"Bearer \" + key },\n    body: JSON.stringify({ model: \"deepseek-chat\", temperature: 0.2, messages: [{ role: \"system\", content: sys }, { role: \"user\", content: userMsg + \"\\n\\n===== rubric =====\\n\" + rubric + \"\\n\\n===== process_evidence =====\\n\" + pe }], max_tokens: 3500 })\n  });\n  const d = await r.json();\n  if (!r.ok) return \"ERR \" + r.status;\n  return d.choices[0].message.content;\n}\n\n(async () => {\n  const weight = { \"知识复杂度\": 0.30, \"思维深度\": 0.30, \"陷阱密度\": 0.133, \"计算强度\": 0.133, \"陌生度\": 0.133 };\n  const LRange = { L1:[0.01,0.15],L2:[0.15,0.30],L3:[0.30,0.45],L4:[0.45,0.60],L5:[0.60,0.70],L6:[0.70,0.79],L7:[0.79,0.85],L8:[0.85,0.90],L9:[0.90,0.94],L10:[0.94,0.98],L11:[0.98,0.999] };\n  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));\n  for (let i = 1; i <= 3; i++) {\n    const out = await run(i);\n    console.log(`\\n════ 第 ${i} 次 ════`);\n    // 解析 JSON 并展示代码侧计算结果\n    try {\n      const start = out.indexOf(\"{\");\n      const data = JSON.parse(out.slice(start, out.lastIndexOf(\"}\") + 1));\n      for (const q of data.questions) {\n        const raw = q.dim[\"知识复杂度\"]*weight[\"知识复杂度\"] + q.dim[\"思维深度\"]*weight[\"思维深度\"] + q.dim[\"陷阱密度\"]*weight[\"陷阱密度\"] + q.dim[\"计算强度\"]*weight[\"计算强度\"] + q.dim[\"陌生度\"]*weight[\"陌生度\"];\n        const d = (raw - 1) / 4;\n        const [lo, hi] = LRange[q.level] || [0, 1];\n        const dClamped = clamp(d, lo, hi);\n        console.log(`题${q.index}: level=${q.level} 题型=${q.questionCategory} isCorrect=${q.isCorrect} P=${q.P} eta=${q.eta} r=${q.r} 归因=${q.errorAttribution||\"null\"} 知识点=${(q.knowledgePoints||[]).join(\"|\")}`);\n        console.log(`   → 代码算 D = (${raw.toFixed(2)}-1)/4 = ${d.toFixed(3)} 钳制到 [${lo},${hi}] → **${dClamped.toFixed(2)}**`);\n      }\n    } catch (e) {\n      console.log(\"解析失败:\", e.message);\n      console.log(out.slice(0, 1500));\n    }\n  }\n})();\n' 2>&1", "Bash=cd /Users/apple/Desktop/ai-learning-system && DEEPSEEK_API_KEY=sk-REMOVED node -e '\nconst key = process.env.DEEPSEEK_API_KEY;\n\nconst pe = `\n【图二·随堂演练 4 道题 · 学生确认后的 process_evidence（可信）】\n\n题1（填空）：A={x|0≤x<3 且 x∈N}（x∈N）→ A={0,1,2}。作答：子集个数 8、真子集个数 7。\n题2（选择）：M={x|x=k/2+1/4, k∈Z}，N={x|x=k/4+1/2, k∈Z}，若 x0∈M，则 x0 与 N 的关系？A.x0∈N B.x0∉N C.∈或∉ D.不能确定。作答：A。\n题3（解答）：A={1,2,a}，B={1,a²−a}，A⊇B 求 a。① a²−a=a → a=0 或 a=2，【舍去项：a=2；保留项：a=0】② a²−a=2 → a=2 或 a=−1。结论：a=0 或 a=−1\n题4（解答）：A={x∈R|x²−2x−8=0}={4,−2}，B={x∈R|x²+ax+a²−12=0}，B⊆A 求 a。B=∅：Δ<0 → a<−4 或 a>4；单元素 Δ=0 → a=4 或 a=−4，【a=4 时 x=−2 保留】【a=−4 时 x=2 舍去】；B={4,−2}：Δ>0 → a=−2。结论：a<−4 或 a≥4 或 a=−2\n`;\n\nconst rubric = `\n【D 难度判定：L1~L11 固定标尺 + 例子锚（决策 020）】\n判定方法：先找\"和本题最像的高考锚例\"，再落档。锚例：\n  L1 送分(0.01-0.15)：A={1,2,3},B={2,3,4}求A∩B——读题即写答案，0步\n  L2 送分→简单(0.15-0.30)：f(x)=√(x-1)求定义域——套1公式1-2步\n  L3 简单(0.30-0.45)：比较log₂3与log₃4大小——套1-2公式2-3步无变形\n  L4 中下(0.45-0.60)：△ABC a=5,b=7,C=60°求c——3-5步标准流程，课本套路\n  L5 中档(0.60-0.70)：裂项求和Σ1/(a_k·a_{k+1})——5-10步轻度分类\n  L6 中档→中上(0.70-0.79)：e^x-ax²两零点求a范围——复杂含参讨论\n  L7 中上(0.79-0.85)：过椭圆外点作切线切点连线过定点——二级结论/高观点\n  L8 较难(0.85-0.90)：极值点偏移证明x₁+x₂>2——高数背景初等化\n  L9(0.90-0.94)多高观点叠加 / L10(0.94-0.98)竞赛板块 / L11(0.98+)IMO纯原创\n  ⚠️ 判档时区分：课本流程套路题（分类讨论但属常规训练）→ L3-L4；需构造性跳跃/高观点 → L7+\n  ⚠️ 题4（B⊆A 分类讨论）是初升高常规流程题，参考锚例\"△ABC求c\"→ 应落 L3-L4，不是 L5+\n\n【题型分类（门禁1）】回忆类=直接套公式无推理；单元内=本单元变形/推理/分类讨论；跨单元=结合≥2单元。题4 集合+方程判别式+韦达=单元内综合（不跨\"板块\"，仍是集合单元内）\n\n【P 过程分（§4.4）】1.0 清晰正确 / 0.5 部分正确模糊 / 0.3 错误有思路 / 0 空白\n【η】只对解答题判 0.4~1.0（本质解法0.9+；漏情况/暴力0.4-0.6）；填空/选择无过程 → null\n【r】一律 null（无追问）\n【isCorrect】严格数学判定。题4：a≥4 已覆盖 a=4（a=4 时 B={−2}⊆A 成立）→ 结论完整正确\n【归因】做错才给；做对 null。不编造\n`;\n\nconst sys = \"你是严谨的数学诊断推理引擎。严格按 rubric：只输出分类结果（不输出 D 数值）。只输出 JSON。\";\nconst userMsg = `按 rubric 对每题输出：\n{\"questions\":[{\"index\":1,\"questionCategory\":\"回忆类|单元内应用|跨单元应用\",\"level\":\"L1~L11\",\"isCorrect\":true|false,\"correctAnswer\":\"\",\"P\":0|0.3|0.5|1.0,\"eta\":0.4~1.0|null,\"r\":null,\"errorAttribution\":null|\"\",\"knowledgePoints\":[\"\"]}]}\n约束：禁止输出 D 数值；eta 只在解答题给数值；只输出 JSON`;\n\nasync function run(n) {\n  const r = await fetch(\"https://api.deepseek.com/chat/completions\", {\n    method: \"POST\",\n    headers: { \"Content-Type\": \"application/json\", Authorization: \"Bearer \" + key },\n    body: JSON.stringify({ model: \"deepseek-chat\", temperature: 0.2, messages: [{ role: \"system\", content: sys }, { role: \"user\", content: userMsg + \"\\n\\n===== rubric =====\\n\" + rubric + \"\\n\\n===== process_evidence =====\\n\" + pe }], max_tokens: 3000 })\n  });\n  const d = await r.json();\n  if (!r.ok) return \"ERR \" + r.status;\n  return d.choices[0].message.content;\n}\n\n(async () => {\n  const LMid = { L1:0.08, L2:0.225, L3:0.375, L4:0.525, L5:0.65, L6:0.745, L7:0.82, L8:0.875, L9:0.92, L10:0.96, L11:0.99 };\n  for (let i = 1; i <= 3; i++) {\n    const out = await run(i)