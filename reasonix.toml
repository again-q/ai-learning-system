nst TASK = `请对第 (3)(ii) 小问做两件事：\n\n【第一步】拆解：把解出这道小题必须经过的步骤，从第 1 步到最终完成，完整列出来（每步写清楚做了什么数学操作/推理）。这一步不需要真的算完，只需要把步骤链拆出来。\n\n【第二步】难度量化评估：给这道小题一个难度分数（数字越大越难，建议范围 0~10），并逐条说明依据。依据请从以下维度给：\n1. 步骤数量与链条长度\n2. 抽象程度（有无具体函数可依赖）\n3. 需要的关键构造/技巧（是否反直觉、是否难想到）\n4. 前置知识跨度（跨了几个知识点/单元）\n5. 容错度（一步错是否全盘皆输）\n\n输出格式：\n## 步骤拆解\n1. ... 2. ... （完整列出）\n## 难度评估\n分数：X/10\n依据：\n- 步骤：...\n- 抽象度：...\n- 关键构造：...\n- 前置跨度：...\n- 容错度：...`;\n\n(async () => {\n  const t0 = Date.now();\n  const v = await fetch('https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', {\n    method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + QKEY },\n    body: JSON.stringify({ model: 'qwen3.7-plus', messages: [{ role: 'user', content: [{ type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + img } }, { type: 'text', text: VISION_PROMPT }] }], max_tokens: 3000, enable_thinking: false })\n  }).then(r => r.json());\n  const report = v.choices[0].message.content;\n  console.log('① Qwen 转录 ✅', Math.round((Date.now() - t0) / 1000) + 's');\n\n  const t1 = Date.now();\n  const r = await fetch('https://api.deepseek.com/chat/completions', {\n    method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + DSKEY },\n    body: JSON.stringify({ model: 'deepseek-v4-flash', thinking: { type: 'enabled' }, reasoning_effort: 'high', messages: [{ role: 'system', content: '你是资深高中数学教师，擅长拆解题目的解题结构并评估难度。' }, { role: 'user', content: TASK + '\\n\\n===== 题目 =====\\n' + report }], max_tokens: 8000 })\n  }).then(r => r.json());\n  const msg = r.choices[0].message;\n  const raw = msg.content || msg.reasoning_content || '';\n  console.log('② 拆解+难度评估 ✅', Math.round((Date.now() - t1) / 1000) + 's, content:', msg.content ? '有' : '空(回退reasoning)');\n  console.log('\\n' + raw.slice(0, 4000));\n})();\nEOF\nnode --check /tmp/difficulty-solve.js && echo \"语法 OK\" && nohup env DEEPSEEK_API_KEY=sk-REMOVED node /tmp/difficulty-solve.js \"/Users/apple/Desktop/微信图片_20260810160122_63_127.jpg\" > /tmp/difficulty_result.txt 2>&1 &\necho \"PID $! 启动\"", "Bash=cd /Users/apple/Desktop/ai-learning-system && sed -i '' \"s/thinking: { type: 'enabled' }, reasoning_effort: 'high'/thinking: { type: 'disabled' }/\" /tmp/difficulty-solve.js && grep -c \"disabled\" /tmp/difficulty-solve.js && nohup env DEEPSEEK_API_KEY=sk-REMOVED node /tmp/difficulty-solve.js \"/Users/apple/Desktop/微信图片_20260810160122_63_127.jpg\" > /tmp/difficulty_result2.txt 2>&1 &\necho \"PID $! disabled 重跑\"", "Bash=cd /Users/apple/Desktop/ai-learning-system && python3 << 'EOF'\nsrc = open('/tmp/difficulty-solve.js', encoding='utf-8').read()\nold = \"\"\"const TASK = `请对第 (3)(ii) 小问做两件事：\n\n【第一步】拆解：把解出这道小题必须经过的步骤，从第 1 步到最终完成，完整列出来（每步写清楚做了什么数学操作/推理）。这一步不需要真的算完，只需要把步骤链拆出来。\n\n【第二步】难度量化评估：给这道小题一个难度分数（数字越大越难，建议范围 0~10），并逐条说明依据。依据请从以下维度给：\n1. 步骤数量与链条长度\n2. 抽象程度（有无具体函数可依赖）\n3. 需要的关键构造/技巧（是否反直觉、是否难想到）\n4. 前置知识跨度（跨了几个知识点/单元）\n5. 容错度（一步错是否全盘皆输）\n\n输出格式：\n## 步骤拆解\n1. ... 2. ... （完整列出）\n## 难度评估\n分数：X/10\n依据：\n- 步骤：...\n- 抽象度：...\n- 关键构造：...\n- 前置跨度：...\n- 容错度：...`;\"\"\"\nnew = \"\"\"const TASK = `请对第 (3)(ii) 小问做两件事，要求输出**可复现、可核对**的评估（不是感觉）：\n\n【第一步】步骤拆解：把解出这道小题必须经过的步骤从第 1 步到完成完整列出，每步写清具体数学操作/推理。这一步不需要算出最终答案，但每步必须具体到\"做了什么变换/用了什么条件/得到什么中间结论\"，不允许\"设法\"\"尝试\"\"构建桥梁\"这类含糊表述。\n\n【第二步】难度量化评估（重点：通用评分标准 + 得分具体由来）：\n1. 先定义【通用评分标准】：制定一份可复用的 0~10 分难度评分量表，每个分数区间对应明确的特征描述（例如 0-2 分=直接套公式；3-4 分=2-3 步常规推导；5-6 分=多步但套路明确；7-8 分=需要关键构造或抽象推理；9-10 分=多重抽象构造叠加）。这个量表要能用于任意数学题，不针对本题。\n2. 再用这个量表给本题打分，必须给出【得分具体由来】：对照量表逐项说明——步骤数多少、抽象到什么程度、关键构造是哪一步（指到你拆解的某个具体步骤号）、前置跨了哪些知识点（列名称）、容错度如何，每一项分别对应量表的哪一档、贡献几分，最后加起来/加权得到总分。\n3. 输出\"若换一个人/另一种解法，分数会怎么变\"的敏感性说明（这题难度的判定哪些部分稳定、哪些部分依赖解法选择）。\n\n输出格式：\n## 通用评分标准（0~10 量表，可复用）\n- 0-2分：...\n- 3-4分：...\n- 5-6分：...\n- 7-8分：...\n- 9-10分：...\n## 步骤拆解（具体到每一步的数学操作）\n1. ...\n## 难度评估\n总分：X/10（对照量表）\n- 步骤维度：X 分（依据：拆解共有 N 步，对应量表...档）\n- 抽象度维度：X 分（依据：...）\n- 关键构造维度：X 分（依据：第 N 步的...构造，对应...档）\n- 前置跨度维度：X 分（依据：涉及知识点 集合语言/单调性/...，对应...档）\n- 容错度维度：X 分（依据：...）\n- 总分计算：各维度 X 分 → 合成规则 → 总分 X/10\n## 敏感性说明\n- 稳定部分：...\n- 依赖解法选择的部分：...`;\"\"\"\nassert old in src\nopen('/tmp/difficulty-solve.js', 'w', encoding='utf-8').write(src.replace(old, new))\nprint('prompt 已升级：通用量表 + 得分具体由来 + 敏感性')\nEOF\nnode --check /tmp/difficulty-solve.js && nohup env DEEPSEEK_API_KEY=sk-REMOVED node /tmp/difficulty-solve.js \"/Users/apple/Desktop/微信图片_20260810160122_63_127.jpg\" > /tmp/difficulty_result3.txt 2>&1 &\necho \"PID $! 二次拆解启动\"", "Bash=cd /Users/apple/Desktop/ai-learning-system && python3 << 'EOF'\nsrc = open('/tmp/difficulty-solve.js', encoding='utf-8').read()\n\n# 1) effort 提到 high\nsrc = src.replace(\"reasoning_effort: 'high'\", \"reasoning_effort: 'high'\")\nsrc = src.replace(\"reasoning_effort: 'disabled'\", \"reasoning_effort: 'high'\")\n# 确保 thinking enabled\nsrc = src.replace(\"thinking: { type: 'disabled' }\", \"thinking: { type: 'enabled' }, reasoning_effort: 'high'\")\n\n# 2) TASK 改为学生视角难度评估\nold_marker = \"const TASK = `\"\nidx = src.index(old_marker)\nend_idx = src.index(\"`;\", idx)\nnew_task = \"\"\"const TASK = `请用【学生视角】评估这道题（第 (3)(ii) 小问）的难度。不要做严谨证明，不要拆解题步骤——而是模拟一个数学水平中等偏上、能顺利做出 (1)(2) 小问、但第一次接触\"新定义集合 D(x₀)\"这类题的高中生，描述他真实的认知体验：\n\n1. 认知路径（学生视角）：他看到这题的先后心理活动——先注意到什么（哪些条件醒目）、会先尝试什么、在哪个具体位置第一次卡住、卡住时脑子里缺的是什么（是知识没学过、还是想到了但不知道怎么组合、还是根本不知道从哪下手）。\n2. 认知负荷拆解（这是评分的核心依据，要具体）：\n   - 需要哪些知识储备（逐个列出，标出哪个是初中/高一基础、哪个是本题特有的新概念）\n   - 思维需要几次\"跳跃\"（从 A 想到 B 的跳跃，每次跳跃的难度：自然/需要提示/极难想到）\n   - 题目的\"陌生度\"：学生有没有见过类似题型（新定义集合题在中档生里常见吗）\n   - 试错成本：走错一个方向后能不能回来，还是直接陷入死胡同\n3. 只给一个难度分数（0~10，数字越大越难）+ 学生视角的逐条依据（为什么是这个分，每个依据对应上面认知负荷的哪一项）。\n\n要求：思考要深，站在\"一个真实学生会怎么卡\"的角度，而不是\"这道题数学上多严谨\"。输出格式：\n## 学生认知路径\n...\n## 认知负荷拆解\n- 知识储备：...\n- 思维跳跃：...\n- 陌生度：...\n- 试错成本：...\n## 难度评分\n分数：X/10\n依据（逐条对应认知负荷）：...\"\"\"\nsrc = src[:idx] + new_task + src[end_idx:]\n\n# max_tokens 加大\nsrc = src.replace(\"max_tokens: 8000 })\", \"max_tokens: 12000 })\")\nopen('/tmp/difficulty-solve.js', 'w', encoding='utf-8').write(src)\nprint('已改为学生视角 + effort high')\nEOF\nnode --check /tmp/difficulty-solve.js && echo \"语法 OK\" && noh