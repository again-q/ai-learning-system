eplace(\n    \"- [ ] Q20：置信度阈值 0.70 是否采用？（实测依据充分，待拍板）\",\n    \"- [x] ~~Q20：置信度阈值~~ → ✅ **冷启动 0.70（用户拍板）；HIGH/MEDIUM 的 avg 细分参数待实测校准**\")\n\nopen(p, 'w').write(s)\nprint('已更新')\nEOF\ngit add -A && git commit -m \"置信度参数决策: 冷启动0.70, 细分参数待实测校准\" 2>&1 | tail -1", "Bash=cd /Users/apple/Desktop/ai-learning-system && python3 << 'EOF'\np = 'doc/报告设计-讨论状态.md'\ns = open(p).read()\n\ns = s.replace(\n    \"| D-17 | **判题与报告复用同一检索** | searchByPattern 一套函数：判题注入 top-K 细节，报告聚合统计摘要 |\",\n    \"\"\"| D-17 | **判题与报告复用同一检索** | searchByPattern 一套函数：判题注入 top-K 细节，报告聚合统计摘要 |\n| D-18 | **题型 = 三层结构化（AI 输出）** | {domain 知识板块, pattern 题型图式（主粒度）, variant 变体}；pattern = 图式/产生式层（Chi 1981 专家分类；ACT-R IF 条件）；variant 只进语义 |\n| D-19 | **RAG = 结构化为主 + embedding 辅助（用户拍板）** | AI 输出结构化 pattern（保证专家层分类）→ pattern 字段向量近邻检索（非精确匹配）→ 同图式内按整题 embedding 排序；砍掉精确匹配/归一化（工程妥协，不影响认知核心） |\"\"\")\n\ns = s.replace(\n    \"- [ ] Q21：低置信（1~2 条）时注入策略？（注入但标注「参考有限」/ 不注入）\",\n    \"- [ ] Q21：低置信（1~2 条）时注入策略？（注入但标注「参考有限」/ 不注入）\\n- [ ] Q22：pattern 近邻阈值/相似度算法（pattern 字段向量化后的匹配参数，实测校准）\")\n\nopen(p, 'w').write(s)\nprint('已更新')\nEOF\ngit add -A && git commit -m \"报告讨论: 题型三层结构化(D-18) + 结构化为主embedding辅助(D-19) + Q22\" 2>&1 | tail -1", "Bash=cd /Users/apple/Desktop/ai-learning-system && python3 << 'EOF'\nimport json, urllib.request, os, math, re\n\nkey = None\nfor line in open('.env'):\n    m = re.match(r'QWEN_API_KEY=(.+)', line.strip())\n    if m: key = m.group(1).strip()\n\ndef embed(texts):\n    body = {\"model\": \"text-embedding-v4\", \"input\": texts}\n    req = urllib.request.Request(\n        \"https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings\",\n        data=json.dumps(body).encode(),\n        headers={\"Content-Type\": \"application/json\", \"Authorization\": f\"Bearer {key}\"})\n    resp = json.loads(urllib.request.urlopen(req, timeout=30).read())\n    return [d['embedding'] for d in resp['data']]\n\ndef cos(a, b):\n    return sum(x*y for x, y in zip(a, b)) / (math.sqrt(sum(x*x for x in a)) * math.sqrt(sum(x*x for x in b)) or 1)\n\n# 语料：9 题，4 个题型，每题带 AI 结构化 pattern（专家标注模拟）\ncorpus = [\n    # (题名, 题干, pattern)\n    (\"恒成1 不等式\", \"对任意 x>0，ax²+x+1≥0 恒成立，求 a 的范围\", \"恒成立求参数\"),\n    (\"恒成2 三角\", \"设对一切实数 x，sin²x+a·sinx+1 不小于 0，求 a\", \"恒成立求参数\"),\n    (\"恒成3 对数\", \"已知对任意实数 x，log₂(x²+ax+1) 均有意义，求 a\", \"恒成立求参数\"),\n    (\"最值1 基本不等式\", \"已知 x>0，求 y=x+1/x 的最小值\", \"最值问题\"),\n    (\"最值2 二次函数\", \"求 f(x)=x²-4x+3 在 [0,3] 上的最小值\", \"最值问题\"),\n    (\"定义域1\", \"求函数 y=√(x²-4)+1/(x-2) 的定义域\", \"求定义域\"),\n    (\"定义域2 对数\", \"求 y=log₀.₅(2x-1) 的定义域\", \"求定义域\"),\n    (\"递推1 等差型\", \"数列 a₁=1，aₙ₊₁=2aₙ+1，求通项\", \"递推求通项\"),\n    (\"证明1 不等式\", \"证明：对任意 x>0，e^x > x+1\", \"不等式证明\"),\n]\n# 查询：新题（同题型不同写法）\nquery_q = \"若二次函数 f(x)=x²+ax+2 对任意实数 x 都满足 f(x)≥0，求 a\"\nquery_p = \"恒成立求参数\"\n\n# 三路 embedding\nea = embed([q[0] for q in corpus] + [query_q])                       # A: 纯题干\neb = embed([f\"{q[0]}。题型：{q[1]}\" for q in corpus] + [f\"{query_q}。题型：{query_p}\"])  # B: 题干+题型\nec = embed([q[2] for q in corpus] + [query_p])                       # C: pattern 字段近邻\n\nprint(f\"{'':14s} {'A纯题干':>8s} {'B题干+题型':>10s} {'C pattern':>10s}  期望\")\nprint(\"-\"*56)\nfor i, (name, _, _) in enumerate(corpus):\n    sa, sb, sc = cos(ea[-1], ea[i]), cos(eb[-1], eb[i]), cos(ec[-1], ec[i])\n    tag = \"✓恒成立\" if \"恒成\" in name else \"✗异型\"\n    print(f\"{name:14s} {sa:>8.3f} {sb:>10.3f} {sc:>10.3f}  {tag}\")\n\nra = sorted(range(9), key=lambda i: -cos(ea[-1], ea[i]))[:3]\nrb = sorted(range(9), key=lambda i: -cos(eb[-1], eb[i]))[:3]\nrc = sorted(range(9), key=lambda i: -cos(ec[-1], ec[i]))[:3]\nprint(\"\\ntop-3 纯题干:\", [corpus[i][0] for i in ra])\nprint(\"top-3 题干+题型:\", [corpus[i][0] for i in rb])\nprint(\"top-3 pattern :\", [corpus[i][0] for i in rc])\nprint(\"\\n正确召回(3道恒成立全进top3): A:\", set(ra)=={0,1,2}, \" B:\", set(rb)=={0,1,2}, \" C:\", set(rc)=={0,1,2})\nEOF", "Bash=cd /Users/apple/Desktop/ai-learning-system && python3 << 'EOF'\nimport json, urllib.request, os, math, re\nkey = None\nfor line in open('.env'):\n    m = re.match(r'QWEN_API_KEY=(.+)', line.strip())\n    if m: key = m.group(1).strip()\n\ndef embed(texts):\n    body = {\"model\": \"text-embedding-v4\", \"input\": texts}\n    req = urllib.request.Request(\n        \"https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings\",\n        data=json.dumps(body).encode(),\n        headers={\"Content-Type\": \"application/json\", \"Authorization\": f\"Bearer {key}\"})\n    resp = json.loads(urllib.request.urlopen(req, timeout=30).read())\n    return [d['embedding'] for d in resp['data']]\n\ndef cos(a, b):\n    return sum(x*y for x, y in zip(a, b)) / (math.sqrt(sum(x*x for x in a)) * math.sqrt(sum(x*x for x in b)) or 1)\n\n# 库中 pattern（4 个图式，含写法变体）\nlib = [\n    \"恒成立求参数\", \"恒成立求参数\", \"恒成立求参数\",      # 恒成立×3\n    \"最值问题\", \"最值问题\",\n    \"求定义域\", \"求定义域\",\n    \"递推求通项\", \"不等式证明\",\n]\n# 查询：同图式不同写法 + 异图式近邻干扰\nqueries = [\n    (\"恒成立问题求参数范围\", \"✓应近恒成立\"),\n    (\"参数恒成立\", \"✓应近恒成立\"),\n    (\"含参不等式恒成立\", \"✓应近恒成立\"),\n    (\"求函数最值\", \"✓应近最值\"),\n    (\"值域问题\", \"？边界（最值/值域）\"),\n]\nev = embed(lib + [q[0] for q in queries])\nprint(f\"{'查询pattern':16s} {'恒成立':>7s} {'最值':>6s} {'定义域':>6s} {'递推':>6s} {'证明':>6s}  期望\")\nfor qi, (qp, expect) in enumerate(queries):\n    idx = len(lib) + qi\n    row = []\n    for g in [(0,1,2),(3,4),(5,6),(7,),(8,)]:\n        row.append(max(cos(ev[idx], ev[i]) for i in g))\n    print(f\"{qp:16s} {row[0]:>7.3f} {row[1]:>6.3f} {row[2]:>6.3f} {row[3]:>6.3f} {row[4]:>6.3f}  {expect}\")\nEOF", "Bash=cd /Users/apple/Desktop/ai-learning-system && python3 << 'EOF'\nimport json, urllib.request, os, math, re, time\nkey = None\nfor line in open('.env'):\n    m = re.match(r'QWEN_API_KEY=(.+)', line.strip())\n    if m: key = m.group(1).strip()\n\ndef embed(texts, retry=2):\n    body = {\"model\": \"text-embedding-v4\", \"input\": texts}\n    req = urllib.request.Request(\n        \"https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings\",\n        data=json.dumps(body).encode(),\n        headers={\"Content-Type\": \"application/json\", \"Authorization\": f\"Bearer {key}\"})\n    for i in range(retry + 1):\n        try:\n            resp = json.loads(urllib.request.urlopen(req, timeout=30).read())\n            return [d['embedding'] for d in resp['data']]\n        except Exception as e:\n            if i == retry: raise\n            time.sleep(2)\n\ndef cos(a, b):\n    return sum(x*y for x, y in zip(a, b)) / (math.sqrt(sum(x*x for x in a)) * math.sqrt(sum(x*x for x in b)) or 1)\n\nlib = [\"恒成立求参数\"]*3 + [\"最值问题\"]*2 + [\"求定义域\"]*2 + [\"递推求通项\", \"不等式证明\"]\nqueries = [(\"恒成立问题求参数范围\",\"✓应近恒成立\"), (\"参数恒成立\",\"✓应近恒成立\"),\n           (\"含参不等式恒成立\",\"✓应近恒成立\"), (\"求函数最值\",\"✓应近最值\"), (\"值域问题\",\"？边界\")]\nev = embed(lib + [q[0] for q in queries])\nprint(f\"{'查询pattern':18s} {'恒成立':>7s} {'最值':>6s} {'定义域':>7s} {'递推':>6s} {'证明':>6s}  期望\")\nfor qi, (qp, expect) in enumerate(queries):\n    idx = len(lib) + qi\n    row = [max(cos(ev[idx], ev[i]) for i in g) for g in [(0,1,2),(3,4),(5,6),(7,),(8,)]]\n    print(f\"{qp:18s} {row[0]:>7.3f} {row[1]:>6.3f} {row[2]:>7.3f} {row[3]:>6.3f} {row[4]:>6.3f}  {expect}\")\nEOF", "Bash=cd /Users/apple/Desktop/ai-learning-system && KEY=$(grep '^QWEN_API_KEY=' .env | cut -d= -f2) && curl -s --max-time 15 -X POST \"https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings\" -H \"Content-Type: application/json\" -H \"Authorization: Bearer $KEY\" -d '{\"model\":\"text-embedding-v4\",\"input\":\"测试\"}' | head -c 400", "Bash=cd /Users/apple/Desktop/ai-learning-system && python3 << 'EOF'\nimport json, urllib.request, os, math, re\nkey = None\nfor line in open('.env'):\n    m = re.match(r'QWEN_API_KEY=(.+)', line.strip())\n    if m: key = m.group(1).strip()\n\ndef embed(texts):\n    # 分批：每批 ≤ 8 条\n    out = []\n    for i in range(0, len(texts), 8):\n        batch = texts[i:i+8]\n        body = {\"model\": \"text-embedding-v4\", \"input\": batch}\n        req = urllib.request.Request(\n            \"https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings\",\n            data=json.dumps(body).encode(),\n            headers={\"Content-Type\": \"application/json\", \"Authorization\": f\"Bearer {key}\"})\n        resp = json.loads(urllib.request.urlopen(req, timeout=30).read())\n        out.extend(d['embedding'] for d in resp['data'])\n    return out\n\ndef cos(a, b):\n    return sum(x*y for x, y in zip(a, b)) / (math.sqrt(sum(x*x for x in a)) * math.sqrt(sum(x*x for x in b)) or 1)\n\nlib = [\"恒成立求参数\"]*3 + [\"最值问题\"]*2 + [\"求定义域\"]*2 + [\"递推求通项\", \"不等式证明\"]\nqueries = [(\"恒成立问题求参数范围\",\"✓应近恒成立\"), (\"参数恒成立\",\"✓应近恒成立\"),\n           (\"含参不等式恒成立\",\"✓应近恒成立\"), (\"求函数最值\",\"✓应近最值\"), (\"值域问题\",\"？边界\")]\nev = embed(lib + [q[0] for q in queries])\nprint(f\"{'查询pattern':18s} {'恒成立':>7s} {'最值':>6s} {'定义域':>7s} {'递推':>6s} {'证明':>6s}  期望\")\nfor qi, (qp, expect) in enumerate(queries):\n    idx = len(lib) + qi\n    row = [max(cos(ev[idx], ev[i]) for i in g) for g in [(0,1,2),(3,4),(5,6),(7,),(8,)]]\n    print(f\"{qp:18s} {row[0]:>7.3f} {row[1]:>6.3f} {row[2]:>7.3f} {row[3]:>6.3f} {row[4]:>6.3f}  {expect}\")\nEOF", "Bash=cd /Users/apple/Desktop/ai-learning-system && python3 << 'EOF'\n# 1. 测试报告定性为冒烟测试\np = 'doc/RAG题型检索-测试报告.md'\ns = open(p).read()\ns = s.replace(\n    \"# RAG 题型检索 · 测试报告\",\n    \"# RAG 题型检索 · 冒烟测试报告（Smoke Test）\")\ns = s.replace(\n    \"> 2026-08-15 · 验证「题型语义锚 + 结构化检索」方案\",\n    \"\"\"> 2026-08-15 · 验证「题型语义锚 + 结构化检索」方案\n> **定性：冒烟测试** —— 小语料（9~14 条）快速验证方案可行性（方向对不对、机制通不通、参数量级合不合理），**非正式测试**。正式验证需真实题库 + 数百条语料 + 分布统计。\"\"\")\nopen(p, 'w').write(s)\nprint('测试报告已定性')\n\n# 2. 状态文档标注\np2 = 'doc/报告设计-讨论状态.md'\ns2 = open(p2).read()\ns2 = s2.replace(\n    \"| D-12 | **题型锚实测成立（2026-08-15 实测）** | text-embedding-v4 双组测试：同类相似度提升 0.1+（0.59→0.74~0.83），与干扰间距拉大一倍 → 阈值截断可靠 |\",\n    \"| D-12 | **题型锚冒烟测试通过（2026-08-15）** | 冒烟测试（见 `doc/RAG题型检索-测试报告.md`）：同类相似度提升 0.1+、间距拉大一倍；pattern 近邻 3/3 召回、漂移容忍 0.948；纯 embedding 新手式分类被证实；0.70 阈值恰好切开边界。正式验证待真实数据 |\")\nopen(p2, 'w').write(s2)\nprint('状态文档已标注')\nEOF\ngit add -A && git commit -m \"冒烟测试定性: RAG检索测试报告 + 状态文档 D-12 标注; 正式验证待真实数据\" 2>&1 | tail -1", "Bash=cd /Users/apple/Desktop/ai-learning-system && python3 << 'EOF'\np = 'doc/诊断报告-设计讨论记录.md'\ns = open(p).read()\n\nold = \"\"\"## 一、报告的第一性原理\n\n**原点问题**：学生做完题，需要知道接下来该做什么，才能提高成绩。\n\n**成绩提高的机制** = 学生看完报告**做出改变**（练了该练的、改了该改的）。\n而改变的起点不是「做什么」，是**看见为什么**。\n\n**核心原理链**：\n```\n学生不知道自己为什么错 → 所有「怎么做」都是没理解病因就开药\n报告的任务 = 让学生看见自己错在哪 → 恍然大悟 → 才有动力改变\n```\"\"\"\n\nnew = \"\"\"## 一、报告的第一性原理\n\n**核心哲学（用户明示 2026-08-15）**：让学生明白**为什么错**——这是产品存在的理由，不是手段。\n\n**理解错误本身是目的**：学习、成长、不再犯。\n「明白为什么错」→ 自然知道该做什么 → 成绩提高只是副产品（不是设计目标）。\n\n**核心原理链**：\n```\n明白的三层：\n  ① 错在哪（断点）——看见\n  ② 为什么会错（根因）——理解\n  ③ 自己领悟（顿悟）——内化\n报告的全部设计服务于「明白」，成绩提高 = 明白的自然结果\n```\"\"\"\n\nassert old in s\ns = s.replace(old, new)\n\nold2 = \"\"\"## 二、报告的角色定位\n\n**报告 = 单向、静态、≤3 分钟、思考的启动器**\"\"\"\nnew2 = \"\"\"## 二、报告的角色定位\n\n**报告 = 单向、静态、≤3 分钟、让学生明白为什么错的启动器**\"\"\"\nassert old2 in s\ns = s.replace(old2, new2)\n\nopen(p, 'w').write(s)\nprint('已修正')\nEOF\ngit add -A && git commit -m \"第一性原理修正(用户): 让学生明白为什么错=产品核心哲学, 非提高成绩手段\" 2>&1 | tail -1", "Bash=cd /Users/apple/Desktop/ai-learning-system && cat >> doc/报告设计-讨论状态.md << 'EOF'\n\n---\n\n## 三、深挖根因讨论（2026-08-17，进行中，先记录不定稿）\n\n### 已确认的方向\n1. **根因深挖基于历史做题模式**（RAG 30 天窗口），单次错只到「直接原因」层\n2. **根因话术 = 程度化**（「问题可能出在…」+ 证据 + 置信度），不断言\n3. **21 项技术 §21 四步流程**：收集现象 → 定位直接原因 → 探索思想根源（七层地图）→ 规划改进\n4. **七层根源地图 vs 五维对应**：K=知识与理解、A=经验与见识、T=思维格局、Q=学习技术+策略监控、S=情绪+内在资源\n5. **涂改/停顿 = 弱信号**（写错/太急/硬冲多义），只能作参考线索，不能断言（转录也未必可靠）\n6. **二次复核 = 报告异议**（不是参数确认）：报告生成后对单模块异议 → 该模块重新生成（一次复核没发现的问题，报告归因错时纠正）\n7. **报告 = 单向**；顿悟在报告内引发（AI 教练不是 1.0）；问题链可带走（校内触发，蔡格尼克）\n8. **检验 = 成就感环节，非强制**：开放建议（讲给同学/做同类题），不布置任务\n\n### 概念边界不清（K 层 · P 多扣分）——待完善\n- **定义**：概念/公式的适用前提被忽略或误用 → 属 K 层（知识点属性）\n- **处理**：judgeOne prompt 加规则——概念边界不清时 P 压低（比一般过程错误多扣分）\n- **示例（强调只是例子，待 AI 判定时验证）**：\n  - 判别式 Δ≤0：前提「二次项系数≠0」+ 适用「R 上恒成立」——区间恒成立误用\n  - 均值不等式：前提「各项为正」+「定值」\n  - 对数：真数 > 0\n  - 乘除负数变号、开方/绝对值条件\n- **边界**：分类讨论漏情况 = 思想方法（A/方法层）**不是**概念边界；计算错/粗心 = 执行层，不归此\n\n### 待讨论/待定\n- [ ] 概念边界 vs 图式（A）的判定边界：方法用错场景，何时归 K 边界、何时归 A 图式\n- [ ] 「多扣分」的具体幅度（P 压到多少）——待实测校准\n- [ ] 报告异议的输入形式（点「不对」即可 / 需附说明）\n- [ ] 异议重生成后的数据回写（revisions[] 修正记录）\n- [ ] 根因置信度三档的话术模板\nEOF\ngit add -A && git commit -m \"深挖根因讨论记录: 21项四步/七层地图/报告异议/概念边界K层多扣分(示例待验证)\" 2>&1 | tail -1", "Bash=cd /Users/apple/Desktop/ai-learning-system && python3 << 'EOF'\np = 'doc/报告设计-讨论状态.md'\ns = open(p).read()\n\nold = \"\"\"- **示例（强调只是例子，待 AI 判定时验证）**：\n  - 判别式 Δ≤0：前提「二次项系数≠0」+ 适用「R 上恒成立」——区间恒成立误用\n  - 均值不等式：前提「各项为正」+「定值」\n  - 对数：真数 > 0\n  - 乘除负数变号、开方/绝对值条件\"\"\"\n\nnew = \"\"\"- **示例（⚠️ 强调：以下只是举例，不是全部概念边界情形，实际判定由 AI 根据概念前提自行判断）**：\n  - 判别式 Δ≤0：前提「二次项系数≠0」+ 适用「R 上恒成立」——区间恒成立误用\n  - 均值不等式：前提「各项为正」+「定值」\n  - 对数：真数 > 0\n  - 乘除负数变号、开方/绝对值条件\n  - （AI 判定时：凡「概念/公式的前提条件未被确认就使用」均属此类，不限于上例）\"\"\"\n\nassert old in s\ns = s.replace(old, new)\nopen(p, 'w').write(s)\nprint('已补充强调')\nEOF\ngit add -A && git commit -m \"强调: 概念边界例子仅为举例非穷举, AI按概念前提自行判断\" 2>&1 | tail -1", "Bash=cd /Users/apple/Desktop/ai-learning-system && python3 << 'EOF'\nimport re\nfor p in ['doc/报告设计-讨论状态.md', 'doc/诊断报告-设计讨论记录.md', 'doc/RAG题型检索-测试报告.md']:\n    s = open(p).read()\n    n = s.count('图式')\n    s = s.replace('图式', '题型')\n    # 处理「题型层」这类残留读法（原「图式层」→「题型层」可接受，保留）\n    open(p, 'w').write(s)\n    print(f'{p}: 替换 {n} 处')\nEOF\ngrep -rn \"图式\" doc/报告设计-讨论状态.md doc/诊断报告-设计讨论记录.md doc/RAG题型检索-测试报告.md 2>/dev/null | head -3; echo \"(空=已清)\""]
