 JSON.stringify({ model: \"qwen3.7-plus\", messages: [{ role: \"user\", content: [{ type: \"image_url\", image_url: { url: \"data:image/jpeg;base64,\" + img } }, { type: \"text\", text: VISION_PROMPT }] }], max_tokens: 2500, enable_thinking: false })\n  });\n  const d = await r.json();\n  return d.choices[0].message.content;\n}\n\nasync function judge(visionReport) {\n  const userMsg = `输入是视觉转录（可能含转录误差）。按 rubric 对每题输出：\n{\"questions\":[{\"index\":1,\"questionCategory\":\"\",\"level\":\"L1~L11\",\"D\":0~1,\"isCorrect\":true|false,\"correctAnswer\":\"\",\"P\":0|0.3|0.5|1.0,\"eta\":0.4~1.0|null,\"r\":null,\"errorAttribution\":null|\"\",\"knowledgePoints\":[\"\"]}]}\n约束：D 落在 level 区间内；eta 只在解答题；isCorrect 严格数学核验（发现转录可疑处按数学逻辑判定并注明）；只输出 JSON`;\n  const r = await fetch(\"https://api.deepseek.com/chat/completions\", {\n    method: \"POST\",\n    headers: { \"Content-Type\": \"application/json\", Authorization: \"Bearer \" + process.env.DEEPSEEK_API_KEY },\n    body: JSON.stringify({ model: \"deepseek-chat\", temperature: 0.2, messages: [{ role: \"system\", content: sys }, { role: \"user\", content: userMsg + \"\\n\\n===== rubric =====\\n\" + rubric + \"\\n\\n===== vision 转录 =====\\n\" + visionReport }], max_tokens: 3000 })\n  });\n  const d = await r.json();\n  return d.choices[0].message.content;\n}\n\nconst LR = { L1:[0.01,0.15],L2:[0.15,0.30],L3:[0.30,0.45],L4:[0.45,0.60],L5:[0.60,0.70],L6:[0.70,0.79],L7:[0.79,0.85],L8:[0.85,0.90],L9:[0.90,0.94],L10:[0.94,0.98],L11:[0.98,0.999] };\nconst clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));\n\n(async () => {\n  for (let i = 1; i <= 2; i++) {\n    console.log(`\\n════════ 全链路第 ${i} 次 ════════`);\n    const t0 = Date.now();\n    console.log(\"① Qwen 视觉转录中...\");\n    const visionReport = await vision();\n    console.log(`   ✅ 转录完成 (${((Date.now()-t0)/1000).toFixed(1)}s)`);\n    // 提取转录关键行\n    const keys = visionReport.split(\"\\n\").filter(l => /最终答案|舍去|综上|≥|≤|>|<|选项|子集|作答/.test(l));\n    console.log(\"   关键行:\", keys.slice(0, 12)