dels',{headers:{Authorization:'Bearer '+env.QWEN_API_KEY}})\n  .then(r=>r.json())\n  .then(d=>{\n    const ids=(d.data||[]).map(m=>m.id);\n    const match=ids.filter(id=>/qwen/i.test(id)).slice(0,40);\n    console.log('可用 qwen 模型数:', match.length);\n    console.log(match.join('\\n'));\n  })\n  .catch(e=>console.error('失败:',e.message));\n\" 2>&1 | head -50", "Bash=cd /Users/apple/Desktop/ai-learning-system && time node scripts/poc/vision-test.js \"/Users/apple/Desktop/微信图片_20260806214859_60_127.jpg\" > /tmp/vision2.md 2>&1; echo \"=== 耗时如上 ===\"; grep -c \"做题痕迹\" /tmp/vision2.md && echo \"第二跑成功\"", "Bash=cd /Users/apple/Desktop/ai-learning-system && node -e \"\nconst env={};require('fs').readFileSync('.env','utf8').split('\\n').forEach(l=>{const m=l.match(/^\\s*([A-Za-z_][A-Za-z0-9_]*)\\s*=\\s*(.*)\\s*$/);if(m)env[m[1]]=m[2]});\nconst t0=Date.now();\nfetch('https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions',{\n  method:'POST',\n  headers:{'Content-Type':'application/json',Authorization:'Bearer '+env.QWEN_API_KEY},\n  body:JSON.stringify({model:'qwen3.7-plus',messages:[{role:'user',content:'说\\\"hi\\\"'}],max_tokens:5})\n}).then(async r=>{const d=await r.json();console.log('首token到耗时:',(Date.now()-t0)/1000+'s');console.log('usage:',JSON.stringify(d.usage))})\n.catch(e=>console.error('err',e.message));\n\" 2>&1", "Bash=cd /Users/apple/Desktop/ai-learning-system && time node scripts/poc/vision-test.js \"/Users/apple/Desktop/微信图片_20260806214859_60_127.jpg\" > /tmp/vision3.md 2>&1; echo \"=== 耗时 ===\"; tail -3 /tmp/vision3.md; echo \"=== 答案部分 ===\"; grep -A3 \"最终答案\" /tmp/vision3.md | head -8", "Bash=cd /Users/apple/Desktop/ai-learning-system && time node scripts/poc/vision-test.js \"/Users/apple/Desktop/微信图片_20260806214859_60_127.jpg\" \"/Users/apple/Desktop/微信图片_20260806215638_61_127.jpg\" > /tmp/vision_multi.md 2>&1; echo \"=== 总耗时 ===\"; echo \"=== 结果分节 ===\"; grep -n \"📷 图片\\|最终答案\\|涂改\\|草稿/演算\" /tmp/vision_multi.md", "Bash=cd /Users/apple/Desktop/ai-learning-system && bash gate.sh status 2>&1 | head -30", "Bash=cd /Users/apple/Desktop/ai-learning-system && bash gate.sh verify 2>&1 | head -30", "Bash=cd /Users/apple/Desktop/ai-learning-system && DEEPSEEK_API_KEY=sk-REMOVED node -e '\nconst key = process.env.DEEPSEEK_API_KEY;\n\nconst processEvidence = `\n【图二·随堂演练 4 道题 · 经学生确认后的过程证据 process_evidence】\n\n题1（填空）：A={x|0≤x<3 且 x∈N}，子集个数、真子集个数。\n  学生作答：8、7（已确认）\n  题目条件：x∈N（自然数），A={0,1,2}。\n\n题2（选择）：M={x|x=k/2+1/4, k∈Z}，N={x|x=k/4+1/2, k∈Z}，若 x0∈M，则 x0 与 N 的关系是（ ）\n  选项（已转录完整）：A. x0∈N  B. x0∉N  C. x0∈N 或 x0∉N  D. 不能确定\n  学生作答：选 A（画圈）（已确认）\n  条件：两集合的 k∈Z 都有（已确认）。\n\n题3（解答）：A={1,2,a}，B={1,a²−a}，若 A⊇B，求实数 a。\n  学生过程（已确认修正）：\n    ① a²−a=a → a=0 或 a=2，其中 a=2 处写了「舍去」（注意：不是 a=0 舍去，vision 原读 a=0 划掉是误读）\n    ② a²−a=2 → a=2 或 a=−1\n    结论：「综上 a=0 或 a=−1」（已确认）\n  说明：分类①里 a=2 舍去、a=0 保留；分类②里 a=2、a=−1 的取舍学生未单独说明，以结论为准。\n\n题4（解答）：A={x∈R|x²−2x−8=0}，B={x∈R|x²+ax+a²−12=0}，若 B⊆A，求实数 a 的取值范围。\n  学生过程（已确认修正）：\n    B=∅：Δ<0 → a<−4 或 a>4\n    单元素：当 B={4} 或 B={−2} 时，Δ=0 → a=4 或 a=−4\n        当 a=4 时 x=−2（保留）；当 a=−4 时 x=2（舍去）（已确认：只有 a=−4 舍去，vision 原读两处都舍去是误读）\n    B={4,−2}：Δ>0 → a=−2\n    结论：「综上 a<−4 或 a>4 或 a=−2」（已确认）\n  注意：题目条件 B={x∈R|...} 的 x∈R 存在（vision 原转录遗漏）。\n\n题1、2 是已作答的小题；题3、4 是解答题（有完整过程，涂改较多）。\n`;\n\nconst prompt = `你是诊断引擎第三阶段（核心推理与归因，DeepSeek Flash 角色）。输入是经学生确认后的 process_evidence（已可信，无需质疑转录）。\n\n任务：对每题输出**诊断全参数**（AI 填参，数值由代码硬算——你只出定性结论和参数，不出五维分数）。严格按以下 JSON schema 输出，每题一个对象，4 题一个数组：\n\n{\n  \"questions\": [\n    {\n      \"index\": 1,\n      \"questionCategory\": \"回忆类|单元内应用|跨单元应用|无法归类\",\n      \"categoryReason\": \"一句话依据\",\n      \"isCorrect\": true|false,\n      \"correctAnswer\": \"本题正确结果\",\n      \"D\": { \"value\": 0~1, \"reason\": \"鉴别力：知识复杂度/思维深度/陷阱密度/计算强度/陌生度 5 维简要评估\" },\n      \"P\": \"过程分4档（完整规范/有步骤省略/思路正确但跳步/过程混乱），本题证据对应档位\",\n      \"eta\": { \"value\": 0.4~1.0, \"confidence\": \"高|中|低\", \"reason\": \"路径质量：解法是否接近本质（暴力 vs 本质）\" },\n      \"r\": null,\n      \"errorAttribution\": \"错因（无错则 null）：概念缺失|方法选择|计算执行|审题条件|过程回溯 + 一句话\",\n      \"knowledgePoints\": [\"关联知识点名称\"],\n      \"keyEvidence\": [\"支撑判断的关键过程证据\"]\n    }\n  ]\n}\n\n要求：\n- η 依据学生解题过程判断：分类讨论完整/逻辑清晰=接近本质；暴力硬算/漏情况=路径质量低\n- 题1题2 是回忆/基础题，η 仍按过程证据给（无过程则说明）\n- 题4 注意：学生结论 a<−4 或 a>4 或 a=−2 是否完整（a=4 时 B={−2}⊆A 是否该保留？数学上判定 isCorrect）\n- 只输出 JSON，不要多余文字`;\n\nfetch(\"https://api.deepseek.com/chat/completions\", {\n  method: \"POST\",\n  headers: { \"Content-Type\": \"application/json\", Authorization: \"Bearer \" + key },\n  body: JSON.stringify({\n    model: \"deepseek-chat\",\n    messages: [\n      { role: \"system\", content: \"你是严谨的数学诊断推理引擎，只输出结构化 JSON。\" },\n      { role: \"user\", content: prompt + \"\\n\\n===== process_evidence =====\\n\" + processEvidence }\n    ],\n    max_tokens: 3000\n  })\n}).then(async r => {\n  const d = await r.json();\n  if (!r.ok) { console.error(\"HTTP\", r.status, JSON.stringify(d).slice(0, 500)); process.exit(1); }\n  console.log(d.choices[0].message.content);\n}).catch(e => console.error(\"err:\", e.message));\n' 2>&1", "Bash=cd /Users/apple/Desktop/ai-learning-system && node -e '\nconst fs = require(\"fs\");\nconst env = {};\nfs.readFileSync(\".env\",\"utf8\").split(\"\\n\").forEach(l=>{const m=l.match(/^\\s*([A-Za-z_][A-Za-z0-9_]*)\\s*=\\s*(.*)\\s*$/);if(m)env[m[1]]=m[2]});\nconst KEY = env.QWEN_API_KEY, MODEL = \"qwen3.7-plus\";\nconst img = fs.readFileSync(\"/Users/apple/Desktop/微信图片_20260806215638_61_127.jpg\").toString(\"base64\");\nconst PROMPT = `你是数学学习诊断助手的图像理解阶段。任务：准确转录题目 + 如实描述做题痕迹。不要做诊断判断。\n\n输出 Markdown：\n# 题目转录（每题：题号/完整题干含所有条件和选项内容/题目形式）\n# 做题痕迹观察（按书写顺序逐条：第N步+位置+痕迹）\n# 痕迹清单（涂改/草稿/停顿/跳步/最终答案——最终答案必须逐字符精确，符号≥≤><=不能错）\n# 输出要求：不确定处标(不确定)；看不清写(看不清)；不臆测`;\n\nasync function run(n) {\n  const r = await fetch(\"https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions\", {\n    method: \"POST\",\n    headers: { \"Content-Type\": \"application/json\", Authorization: \"Bearer \" + KEY },\n    body: JSON.stringify({ model: MODEL, messages: [{ role: \"user\", content: [{ type: \"